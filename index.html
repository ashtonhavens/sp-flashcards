<!DOCTYPE html>
<html>
    <head>
        <title>Mr. Pettijohn Spanish 2</title>

        <style>
            main {
                width: 100%;
                margin: auto;
                margin-top: 50px;
                text-align: center;
                display: flex;
                gap: 25px;
                justify-content: center;
            }

            #card {
                width: 400px;
                height: 200px;
                border: 1px black dashed;
                margin: auto;
                margin-top: 0px;
                margin-bottom: 10px;
                font-size: 20px;
                padding: 25px;
                margin-top: 5px;
            }

            #enorsp {
                font-style: italic;
            }

            #lesson_check {
                width: 250px;
                text-align: left;
                padding-top: 5px;  
            }
        </style>
    </head>
    <body>
        <button onclick="show_directions()" style="position: absolute;">?</button><br>
        <div id="directions" style="display: none; position: absolute; top: 40px; font-style: italic;">
            Right Arrow Key / d: next card<br>
            Left Arrow Key / a: previous card<br>
            Space / f: flip<br>
            r: random card<br>
            <br>
            made by ashton havens '27<br>
            special thanks to william "the goat" krug '26<br>
            et al.<br>
            <br>
            <a href="https://github.com/ashtonhavens/sp-flashcards" target="_blank">view source</a> <!-- hello -->
        </div>
        <script>
            const directions = document.getElementById('directions');
            var shown = false;
            function show_directions() {
                shown = !shown;
                directions.style.display = shown ? 'block' : 'none';
            }
        </script>

        <main>
            <div id="lesson_check">
                <input type="checkbox" id="0">
                <label for="0">(1.0) En el consultorio</label><br>
                <input type="checkbox" id="1">
                <label for="1">(1.1) Imperfect Tense</label><br>
                <input type="checkbox" id="2">
                <label for="2">(1.2) Preterite and Imperfect</label><br>
                <input type="checkbox" id="3">
                <label for="3">(1.3) Constructions with se</label><br>
                <input type="checkbox" id="4">
                <label for="4">(1.4) Adverbs</label><br>
                <input type="checkbox" id="5">
                <label for="5">(2.0) La Tecnología</label><br>
                <input type="checkbox" id="6">
                <label for="6">(2.1) Familiar Commands</label><br>
                <input type="checkbox" id="7">
                <label for="7">(2.2) Por and Para</label><br>
                <input type="checkbox" id="8">
                <label for="8">(2.3) Reciprocal Reflexives</label><br>
                <input type="checkbox" id="9">
                <label for="9">(2.4) Stressed Possessive Adjectives and Pronouns</label><br>
                <input type="checkbox" id="10">
                <label for="10">(3.0) La Vivienda</label><br>
                <input type="checkbox" id="11">
                <label for="11">(3.1) Relative Pronouns</label><br>
                <input type="checkbox" id="12">
                <label for="12">(3.2) Formal Usted and Ustedes Commands</label><br>
                <input type="checkbox" id="13">
                <label for="13">(3.3) The Present Subjunctive</label><br>
                <input type="checkbox" id="14">
                <label for="14">(3.4) Subjunctive with Verbs of Will and Influence</label><br>
                <input type="checkbox" id="15">
                <label for="15">(4.0) La Naturaleza</label><br>
                <input type="checkbox" id="16">
                <label for="16">(4.1) The Subjunctive with Verbs of Emotion</label><br>
                <input type="checkbox" id="17">
                <label for="17">(4.2) The Subjunctive with Doubt, Disbelief, and Denial</label><br>
                <input type="checkbox" id="18">
                <label for="18">(4.3) The Subjunctive with Conjunctions</label><br>
                <input type="checkbox" id="19">
                <label for="19">(5.0) En la Ciudad</label><br>
                <input type="checkbox" id="20">
                <label for="20">(5.1) The Subjunctive in Adjective Clauses</label><br>
                <input type="checkbox" id="21">
                <label for="21">(5.2) Nosotros/as Commands</label><br>
                <input type="checkbox" id="22">
                <label for="22">(5.3) Past Participles Used as Adjectives</label><br>
            </div>
            <div>
                <div id="lesson"></div>
                <div id="enorsp"></div>
                <div id="card"></div>
                <button onclick="flip()">Flip</button>
                <button onclick="random_card()">Random Card</button>
                <br><br>
                <button onclick="next_card(false)">Previous Card</button>
                <button onclick="next_card(true)">Next Card</button>
            </div>
        </main>


        <script src="info.js?version=520"></script>
        <script>
            
             // you are now entering spaghetti code land //
            //               POPULATION: 1              //
            
            const card = document.getElementById('card');
            const enorsp = document.getElementById('enorsp');
            const lesson = document.getElementById('lesson');
            const checks = document.getElementById('lesson_check');

            const lessons = '1.0 1.1 1.2 1.3 1.4 2.0 2.1 2.2 2.3 2.4 3.0 3.1 3.2 3.3 3.4 4.0 4.1 4.2 4.3 5.0 5.1 5.2 5.3 5.4 6.0 6.1 6.2 6.3 6.4 6.5 7.0 7.1 7.2 7.3 7.4 7.5 8.0 8.1 8.2 8.3 8.5 9.0 9.1 9.2 9.5'.split(' ');

            let __checked = localStorage.getItem('checked');
            var checked_saved = __checked ? JSON.parse(__checked) : [];
            for (let check of checked_saved) {
                document.getElementById(check).checked = true;
            }

            var flipped = false;
            
            let current_lesson = 0;
            let current_item = 0;

            let current_thing, current_problem, current_result;
            
            var checked = [];

            var none_checked = false;

            function is_checked(n) {
                for (let i of checked) {
                    if (n == i) return true;
                }
                return false;
            }

            function update_card() {
                console.log(none_checked)
                if (none_checked) {
                    card.innerHTML = '<i>Check some lessons!</i>';
                    enorsp.innerText = '-';
                    lesson.innerText = '-';
                    return;
                }
                card.innerText = info[current_lesson][current_item][flipped ? 0 : 1];
                enorsp.innerText = flipped ? 'spanish' : 'english';
                lesson.innerText = `${lessons[current_lesson]} : ${current_item}`
            }

            function update_variables() {
                console.log(current_lesson)
                current_thing = info[current_lesson][current_item];
                current_problem = current_thing[1];
                current_result = current_thing[0];
            }

            function get_next_valid_lesson(l, dir) {
                if (none_checked) return 0;

                let il = l;
                while (true) {
                    l += (dir ? 1 : -1);
                    if ((dir && l >= info.length) || (!dir && l < 0)) {
                        l = (dir ? 0 : info.length-1);
                    }
                    if (is_checked(l) || il == l) {
                        break;
                    }
                }
                return l;
            }

            function change_lesson(dir) {
                if (checked.length === 0) {
                    return;
                }

                flipped = false;

                current_item = 0;
                current_lesson = get_next_valid_lesson(current_lesson, dir);

                update_variables();
                update_card();
            }

            function update_checked() {
                checked = [];
                for (let ele of checks.children) {
                    if (ele.checked == undefined) {
                        continue;
                    }
                    let lnum = parseInt(ele.id);
                    if (ele.checked) {
                        checked.push(lnum);
                    } else if (lnum == current_lesson) {
                        current_lesson++;
                        current_item = 0;
                    }
                }

                localStorage.setItem('checked', JSON.stringify(checked));

                none_checked = false;
                if (checked.length == 0) {
                    none_checked = true;
                }

                if (current_lesson >= info.length) {
                    current_lesson = get_next_valid_lesson(current_lesson, true);
                }

                update_variables();
                update_card();
            }

            function flip() {
                flipped = !flipped;
                update_card();
            }

            function next_card(dir) {
                if (checked.length == 0) {
                    return;
                }

                flipped = false;
                current_item += (dir ? 1 : -1);

                if ((dir && current_item >= info[current_lesson].length) || (!dir && current_item < 0)) {
                    current_lesson = get_next_valid_lesson(current_lesson, dir);
                    current_item = (dir ? 0 : info[current_lesson].length-1);
                }


                update_variables();
                update_card();
            }

            function random_card() {
                flipped = false;

                current_lesson = -1;
                while (!is_checked(current_lesson))
                    current_lesson = Math.random() * info.length | 0;

                current_item = Math.random() * info[current_lesson].length | 0;

                update_variables();
                update_card();
            }

            for (let i = 0; i >= 0; i++) {
                if (document.getElementById(i) == undefined) break;
                document.getElementById(i)?.addEventListener('change', update_checked);
            }

            addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
                    e.preventDefault();
                    next_card(true);
                } else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
                    e.preventDefault();
                    next_card(false);
                } else if (e.key === ' ' || e.key.toLowerCase() === 'f') {
                    e.preventDefault();
                    flip();
                } else if (e.key.toLowerCase() === 'r') {
                    e.preventDefault();
                    random_card();
                }
            });

            update_checked();
        </script>
    </body>
</html>
